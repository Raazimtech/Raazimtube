<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Anime · Only Naru</title><style>body{margin:0;background:#090909;color:#fff;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}a{text-decoration:none;color:inherit}.top{height:68px;border-bottom:1px solid #252525;display:flex;align-items:center;padding:0 clamp(16px,5vw,60px);gap:14px;position:sticky;top:0;background:rgba(9,9,9,.94);backdrop-filter:blur(16px);z-index:5}.mark{width:38px;height:38px;border-radius:11px;background:#ff6b00;color:#111;display:grid;place-items:center;font-weight:900}.brand{font-weight:800;font-size:20px}.back{margin-left:auto;border:1px solid #292929;background:#151515;color:#fff;border-radius:11px;padding:9px 13px;font-weight:700}.wrap{width:min(1250px,100%);margin:auto;padding:28px 18px 80px}.hero{position:relative;min-height:390px;border:1px solid #252525;border-radius:22px;overflow:hidden;background:#111;display:flex;align-items:end;padding:36px}.banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;mask-image:linear-gradient(90deg,#000 0%,transparent 90%)}.content{position:relative;max-width:720px}.poster{width:180px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;float:left;margin:0 25px 10px 0;border:1px solid #333}.eyebrow{color:#ff8a33;text-transform:uppercase;font-weight:800;font-size:11px;letter-spacing:1.5px}.title{font-size:clamp(32px,5vw,56px);letter-spacing:-2px;line-height:1;margin:9px 0 13px}.desc{color:#bbb;line-height:1.7;font-size:14px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pill{padding:7px 10px;border-radius:999px;background:#191919;border:1px solid #303030;color:#ccc;font-size:11px}.btn{display:inline-block;background:#ff6b00;color:#111;border-radius:11px;padding:11px 15px;font-size:13px;font-weight:900;margin-top:5px}.section{margin-top:35px}.section h2{font-size:20px}.genres{display:flex;gap:8px;flex-wrap:wrap}.genre{background:#161616;border:1px solid #292929;border-radius:9px;padding:8px 10px;font-size:12px;color:#aaa}.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.ep{background:#131313;border:1px solid #292929;border-radius:12px;padding:14px;transition:.2s}.ep:hover{border-color:#ff6b00;transform:translateY(-2px)}.ep b{display:block;color:#fff;font-size:13px}.ep span{display:block;color:#777;font-size:11px;margin-top:4px}.notice{padding:14px;background:#121212;border:1px solid #282828;border-radius:13px;color:#999;font-size:12px;line-height:1.6}@media(max-width:600px){.hero{padding:22px;min-height:520px;align-items:end}.poster{width:125px;margin-right:16px}.title{font-size:38px}.episodes{grid-template-columns:repeat(2,1fr)}} </style></head><body><header class="top"><a href="./" class="brand" style="display:flex;align-items:center;gap:10px"><b class="mark">N</b><span>Only Naru</span></a><a class="back" href="./">← Home</a></header><main class="wrap"><section class="hero"><img id="banner" class="banner" alt=""><div class="content"><img id="poster" class="poster" alt=""><div class="eyebrow">Anime details</div><h1 id="title" class="title">Loading...</h1><div id="pills" class="pills"></div><p id="desc" class="desc"></p><a id="watch" class="btn" href="#">Start watching</a></div></section><section class="section"><h2>Genres</h2><div id="genres" class="genres"></div></section><section class="section"><h2>Episodes</h2><div id="episodes" class="episodes"></div></section><section class="section"><div class="notice">Playback is separated from anime metadata. Only Naru can open authorized streaming destinations or direct media URLs supplied by your configured provider.</div></section></main><script>const API='https://graphql.anilist.co';const id=new URLSearchParams(location.search).get('id');const Q=`query($id:Int!){Media(id:$id,type:ANIME){id title{english romaji userPreferred}description(asHtml:false)coverImage{extraLarge large}bannerImage averageScore season seasonYear episodes duration format status genres streamingEpisodes{title thumbnail url site}externalLinks{url site type}relations{edges{relationType node{id title{romaji english userPreferred}coverImage{large}}}}}}`;async function run(){if(!id)return;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:Q,variables:{id:Number(id)}})});const d=(await r.json()).data.Media;const t=d.title.english||d.title.romaji||d.title.userPreferred;document.title=t+' · Only Naru';document.getElementById('title').textContent=t;document.getElementById('poster').src=d.coverImage.extraLarge||d.coverImage.large;document.getElementById('banner').src=d.bannerImage||d.coverImage.extraLarge;document.getElementById('desc').textContent=(d.description||'No description available.').replace(/<[^>]+>/g,'');document.getElementById('pills').innerHTML=[d.seasonYear,d.format,d.status,d.episodes?d.episodes+' episodes':null,d.averageScore?'Score '+(d.averageScore/10).toFixed(1):null].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join('');document.getElementById('genres').innerHTML=d.genres.map(x=>`<span class="genre">${x}</span>`).join('');const eps=document.getElementById('episodes');eps.innerHTML='';const total=d.episodes||d.streamingEpisodes?.length||0;for(let i=1;i<=total;i++)eps.innerHTML+=`<a class="ep" href="watch.html?id=${d.id}&episode=${i}"><b>Episode ${i}</b><span>${d.duration?d.duration+' min':''}</span></a>`;if(!total)eps.innerHTML='<div class="notice">Episode data is not available for this title.</div>';document.getElementById('watch').href=`watch.html?id=${d.id}&episode=1`;if(d.streamingEpisodes?.length){document.getElementById('episodes').insertAdjacentHTML('afterbegin','<div style="grid-column:1/-1" class="notice">Official/external streaming links are available in the source information when provided by AniList.</div>')}}catch(e){document.getElementById('title').textContent='Anime unavailable';document.getElementById('desc').textContent='Could not load this title. Please go back and try again.'}}run();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
