<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><link rel="manifest" href="manifest.webmanifest"><title>Naru · Home</title><style>:root{--bg:#080808;--line:#242424;--orange:#ff6b00;--muted:#858585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:12px}.logo{width:38px;height:38px}.brand{font-weight:850;font-size:20px}.wrap{max-width:1250px;margin:auto;padding:25px 18px 105px}.hero{min-height:440px;border:1px solid #262626;border-radius:22px;background:#111;position:relative;overflow:hidden;display:flex;align-items:end;padding:35px}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}.hero .copy{position:relative;max-width:650px}.eyebrow{font-size:11px;color:#ff8a33;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(38px,6vw,68px);line-height:.95;letter-spacing:-2.8px;margin:9px 0}.hero p{font-size:14px;color:#bbb;line-height:1.65}.btn{display:inline-block;background:var(--orange);color:#111;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:900}.section{margin-top:34px}.section h2{font-size:20px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}.poster{aspect-ratio:2/3;border-radius:13px;overflow:hidden;border:1px solid #252525;background:#111}.poster img{width:100%;height:100%;object-fit:cover}.card h3{font-size:12px;margin:8px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:10px;color:#707070;margin:0 2px}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);height:64px;background:#101010;border:1px solid #2b2b2b;border-radius:22px;display:flex;align-items:center;padding:0 8px;z-index:20;box-shadow:0 10px 35px #000}.nav a{width:70px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#777;font-size:9px;font-weight:750;gap:4px}.nav .search{width:60px;height:60px;margin:-18px 5px 0;background:var(--orange);color:#111;border:4px solid var(--bg);border-radius:50%;font-size:10px;box-shadow:0 6px 18px #000}.icon{font-size:18px;line-height:1}@media(max-width:850px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.hero{min-height:510px;padding:23px}.hero h1{font-size:42px}.grid{grid-template-columns:repeat(3,1fr);gap:11px}.nav a{width:55px}.nav .search{width:58px}} </style></head><body><header class="top"><a href="home.html"><img class="logo" src="icon.svg" alt="Naru"></a><a class="brand" href="home.html">Naru</a></header><main class="wrap"><section class="hero"><img id="heroimg" alt=""><div class="copy"><div class="eyebrow">Welcome to Naru</div><h1 id="herotitle">Discover anime.</h1><p id="herodesc">Find something to watch, open its details, and jump into an episode.</p><a id="herocta" class="btn" href="browse.html">Browse anime</a></div></section><section class="section"><h2>Trending</h2><div id="grid" class="grid">Loading...</div></section></main><nav class="nav"><a href="home.html"><span class="icon">⌂</span>Home</a><a href="browse.html"><span class="icon">▦</span>Browse</a><a class="search" href="search.html"><span class="icon">⌕</span>Search</a><a href="library.html"><span class="icon">♡</span>Library</a><a href="profile.html"><span class="icon">○</span>Profile</a></nav><script>const API='https://graphql.anilist.co',Q=`query{Page(page:1,perPage:7){media(type:ANIME,isAdult:false,sort:TRENDING_DESC){id title{english romaji userPreferred}coverImage{extraLarge large}bannerImage description(asHtml:false)averageScore seasonYear episodes}}}`;function card(a){let t=a.title.english||a.title.romaji||a.title.userPreferred;return `<a class="card" href="anime.html?id=${a.id}"><div class="poster"><img loading="lazy" src="${a.coverImage.large}" alt="${t}"></div><h3>${t}</h3><p>${a.seasonYear||'—'} · ${a.episodes||'?'} eps</p></a>`}fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:Q})}).then(r=>r.json()).then(j=>{let a=j.data.Page.media;document.getElementById('grid').innerHTML=a.slice(1).map(card).join('');let h=a[0],t=h.title.english||h.title.romaji||h.title.userPreferred;document.getElementById('herotitle').textContent=t;document.getElementById('heroimg').src=h.bannerImage||h.coverImage.extraLarge;document.getElementById('herodesc').textContent=(h.description||'Discover this anime on Naru.').replace(/<[^>]*>/g,'').slice(0,250);document.getElementById('herocta').href=`anime.html?id=${h.id}`}).catch(()=>document.getElementById('grid').textContent='Could not load anime.');</script></body></html>
