<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><link rel="manifest" href="manifest.webmanifest"><title>Search · Naru</title><style>:root{--bg:#080808;--line:#242424;--orange:#ff6b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1250px;margin:auto;padding:35px 18px 105px}.logo{width:38px}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:12px}.brand{font-weight:850;font-size:20px}.search{height:58px;background:#121212;border:1px solid #303030;border-radius:16px;display:flex;align-items:center;padding:0 17px;margin:15px 0 28px}.search span{font-size:22px;color:#777}.search input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:17px;margin-left:12px}.count{font-size:12px;color:#777}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}.poster{aspect-ratio:2/3;border-radius:13px;overflow:hidden;border:1px solid #252525;background:#111}.poster img{width:100%;height:100%;object-fit:cover}.card h3{font-size:12px;margin:8px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:10px;color:#707070;margin:0 2px}.empty{padding:45px 0;color:#666;text-align:center;font-size:13px}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);height:64px;background:#101010;border:1px solid #2b2b2b;border-radius:22px;display:flex;align-items:center;padding:0 8px;z-index:20;box-shadow:0 10px 35px #000}.nav a{width:70px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#777;font-size:9px;font-weight:750;gap:4px}.nav .searchbtn{width:60px;height:60px;margin:-18px 5px 0;background:var(--orange);color:#111;border:4px solid var(--bg);border-radius:50%;font-size:10px;box-shadow:0 6px 18px #000}.icon{font-size:18px;line-height:1}@media(max-width:850px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:11px}.nav a{width:55px}.nav .searchbtn{width:58px}} </style></head><body><header class="top"><a href="./"><img class="logo" src="icon.svg" alt="Naru"></a><a class="brand" href="./">Naru</a></header><main class="wrap"><h1>Search anime</h1><label class="search"><span>⌕</span><input id="q" autofocus placeholder="Search titles..."></label><div id="count" class="count"></div><div id="grid" class="grid"><div class="empty">Start typing to search.</div></div></main><nav class="nav"><a href="./"><span class="icon">⌂</span>Home</a><a href="browse.html"><span class="icon">▦</span>Browse</a><a class="searchbtn" href="search.html"><span class="icon">⌕</span>Search</a><a href="library.html"><span class="icon">♡</span>Library</a><a href="profile.html"><span class="icon">○</span>Profile</a></nav><script>const API='https://graphql.anilist.co',$=x=>document.getElementById(x),Q=`query($q:String!){Page(page:1,perPage:30){media(type:ANIME,isAdult:false,search:$q,sort:[POPULARITY_DESC]){id title{english romaji userPreferred}coverImage{large}averageScore seasonYear episodes}}}`;function card(a){let t=a.title.english||a.title.romaji||a.title.userPreferred;return `<a class="card" href="anime.html?id=${a.id}"><div class="poster"><img loading="lazy" src="${a.coverImage.large}" alt="${t}"></div><h3>${t}</h3><p>${a.seasonYear||'—'} · ${a.episodes||'?'} eps</p></a>`}let timer;$('q').oninput=e=>{clearTimeout(timer);let q=e.target.value.trim();if(!q){$('count').textContent='';$('grid').innerHTML='<div class="empty">Start typing to search.</div>';return}timer=setTimeout(async()=>{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:Q,variables:{q}})}),d=(await r.json()).data.Page.media;$('count').textContent=d.length+' results';$('grid').innerHTML=d.length?d.map(card).join(''):'<div class="empty">No anime found.</div>'},300)};</script></body></html>
