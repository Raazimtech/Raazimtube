<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><link rel="manifest" href="manifest.webmanifest"><title>Library · Naru</title><style>:root{--bg:#080808;--line:#242424;--orange:#ff6b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:12px}.logo{width:38px}.brand{font-weight:850;font-size:20px}.wrap{max-width:1250px;margin:auto;padding:35px 18px 105px}h1{font-size:42px;letter-spacing:-1.8px;margin:0}.lead{font-size:13px;color:#777;margin:7px 0 25px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}.poster{aspect-ratio:2/3;border-radius:13px;overflow:hidden;border:1px solid #252525;background:#111}.poster img{width:100%;height:100%;object-fit:cover}.card h3{font-size:12px;margin:8px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:55px 0;color:#666;font-size:13px}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);height:64px;background:#101010;border:1px solid #2b2b2b;border-radius:22px;display:flex;align-items:center;padding:0 8px;z-index:20;box-shadow:0 10px 35px #000}.nav a{width:70px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#777;font-size:9px;font-weight:750;gap:4px}.nav .search{width:60px;height:60px;margin:-18px 5px 0;background:var(--orange);color:#111;border:4px solid var(--bg);border-radius:50%;font-size:10px;box-shadow:0 6px 18px #000}.icon{font-size:18px}@media(max-width:850px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:11px}.nav a{width:55px}.nav .search{width:58px}} </style></head><body><header class="top"><a href="./"><img class="logo" src="icon.svg" alt="Naru"></a><a class="brand" href="./">Naru</a></header><main class="wrap"><h1>My Library</h1><p class="lead">Your saved anime, right here.</p><div id="grid" class="grid"></div></main><nav class="nav"><a href="./"><span class="icon">⌂</span>Home</a><a href="browse.html"><span class="icon">▦</span>Browse</a><a class="search" href="search.html"><span class="icon">⌕</span>Search</a><a href="library.html"><span class="icon">♡</span>Library</a><a href="profile.html"><span class="icon">○</span>Profile</a></nav><script>let items=JSON.parse(localStorage.getItem('naru-library')||'[]'),g=document.getElementById('grid');g.innerHTML=items.length?items.map(a=>`<a class="card" href="anime.html?id=${a.id}"><div class="poster"><img src="${a.image}" alt=""></div><h3>${a.title}</h3></a>`).join(''):'<div class="empty">Your library is empty.<br>Open an anime and save it here.</div>';</script></body></html>
