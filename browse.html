<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><link rel="manifest" href="manifest.webmanifest"><title>Browse · Naru</title><style>:root{--bg:#080808;--card:#111;--line:#242424;--muted:#858585;--orange:#ff6b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:12px;position:sticky;top:0;background:#080808;z-index:5}.logo{width:38px;height:38px}.brand{font-weight:850;font-size:20px}.wrap{max-width:1250px;margin:auto;padding:30px 18px 105px}h1{font-size:42px;letter-spacing:-1.8px;margin:0}.lead{color:var(--muted);font-size:13px;margin:7px 0 25px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.chip{white-space:nowrap;background:#121212;border:1px solid #292929;border-radius:999px;color:#bbb;padding:9px 12px;font-size:11px}.chip.active{background:var(--orange);border-color:var(--orange);color:#111;font-weight:800}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:15px;margin-top:24px}.poster{aspect-ratio:2/3;background:#141414;border:1px solid #252525;border-radius:13px;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.card h3{font-size:12px;margin:8px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:10px;color:#707070;margin:0 2px}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);height:64px;background:#101010;border:1px solid #2b2b2b;border-radius:22px;display:flex;align-items:center;padding:0 8px;z-index:20;box-shadow:0 10px 35px #000}.nav a{width:70px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#777;font-size:9px;font-weight:750;gap:4px}.nav .search{width:60px;height:60px;margin:-18px 5px 0;background:var(--orange);color:#111;border:4px solid var(--bg);border-radius:50%;font-size:10px;box-shadow:0 6px 18px #000}.icon{font-size:18px;line-height:1}@media(max-width:850px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){h1{font-size:34px}.grid{grid-template-columns:repeat(3,1fr);gap:11px}.nav a{width:55px}.nav .search{width:58px}} </style></head><body><header class="top"><a href="./"><img class="logo" src="icon.svg" alt="Naru"></a><a class="brand" href="./">Naru</a></header><main class="wrap"><h1>Browse</h1><p class="lead">Find something worth watching.</p><div class="chips" id="chips"></div><div class="grid" id="grid">Loading...</div></main><nav class="nav"><a href="./"><span class="icon">⌂</span>Home</a><a href="browse.html"><span class="icon">▦</span>Browse</a><a class="search" href="search.html"><span class="icon">⌕</span>Search</a><a href="library.html"><span class="icon">♡</span>Library</a><a href="profile.html"><span class="icon">○</span>Profile</a></nav><script>const API='https://graphql.anilist.co',$=x=>document.getElementById(x),genres=['All','Action','Adventure','Comedy','Drama','Fantasy','Romance','Sci-Fi','Thriller'];const Q=`query($genre:String){Page(page:1,perPage:24){media(type:ANIME,isAdult:false,genre:$genre,sort:POPULARITY_DESC){id title{english romaji userPreferred}coverImage{large}averageScore seasonYear episodes}}}`;function card(a){let t=a.title.english||a.title.romaji||a.title.userPreferred;return `<a class="card" href="anime.html?id=${a.id}"><div class="poster"><img loading="lazy" src="${a.coverImage.large}" alt="${t}"></div><h3>${t}</h3><p>${a.seasonYear||'—'} · ${a.episodes||'?'} eps</p></a>`}async function load(g){let body={query:Q,variables:{genre:g==='All'?null:g}};let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=(await r.json()).data; $('grid').innerHTML=d.Page.media.map(card).join('')}$('chips').innerHTML=genres.map((g,i)=>`<button class="chip ${i?'':'active'}">${g}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.textContent)});load('All');</script></body></html>
