<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><meta name="description" content="Naru — a fast, beautiful anime discovery and watching app."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Naru — Anime</title><style>:root{--bg:#090909;--p:#111;--p2:#171717;--t:#fff;--m:#999;--l:#252525;--o:#ff6b00;--o2:#ff8a33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}.top{position:sticky;top:0;z-index:20;height:68px;display:flex;align-items:center;gap:20px;padding:0 clamp(16px,4vw,48px);background:rgba(9,9,9,.95);border-bottom:1px solid var(--l);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.mark{width:38px;height:38px;border-radius:11px;background:var(--o);color:#111;display:grid;place-items:center;font-weight:900}.search{flex:1;max-width:620px;margin:auto;height:42px;display:flex;align-items:center;background:#151515;border:1px solid #292929;border-radius:13px;padding:0 14px}.search input{width:100%;border:0;outline:0;background:none;color:#fff;margin-left:10px}.btn{border:1px solid #292929;background:#151515;color:#fff;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:700}.primary{background:var(--o);border-color:var(--o);color:#111}.wrap{width:min(1400px,100%);margin:auto;padding:24px clamp(16px,4vw,48px) 90px}.hero{position:relative;min-height:470px;border:1px solid var(--l);border-radius:25px;overflow:hidden;background:#111;display:flex;align-items:flex-end;padding:clamp(25px,5vw,55px)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42;mask-image:linear-gradient(90deg,#000 0%,transparent 92%)}.hero>div{position:relative;max-width:690px}.eyebrow{color:var(--o2);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}.hero h1{font-size:clamp(38px,6vw,68px);line-height:.98;letter-spacing:-2.5px;margin:10px 0}.hero p{color:#c4c4c4;line-height:1.65;font-size:14px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pill{background:#1b1b1b;border:1px solid #303030;border-radius:999px;padding:7px 10px;font-size:11px;color:#ccc}.actions{display:flex;gap:9px;flex-wrap:wrap}.section{margin-top:40px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.head h2{margin:0;font-size:21px}.muted{font-size:12px;color:#777}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#161616;border:1px solid #252525;transition:.2s}.poster img{width:100%;height:100%;object-fit:cover}.card:hover .poster{transform:translateY(-4px);border-color:#4a4a4a}.badge,.score{position:absolute;padding:5px 7px;border-radius:7px;font-size:10px;font-weight:800}.badge{top:8px;left:8px;background:#000c}.score{right:8px;bottom:8px;background:var(--o);color:#111}.card h3{font-size:13px;margin:9px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:11px;color:#777;margin:0 2px}.mobile{display:none}.install{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.top{height:62px}.brand span{display:none}.top .btn:not(.primary){display:none}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.hero{min-height:500px;padding:24px 20px}.hero h1{font-size:42px}.mobile{position:fixed;display:flex;bottom:0;left:0;right:0;height:65px;background:#0c0c0cf5;border-top:1px solid #242424;z-index:30;justify-content:space-around}.mobile a{padding:12px 20px;color:#777;font-size:11px}.mobile a.active{color:var(--o)}.install{display:inline-flex}}
</style></head><body><header class="top"><a class="brand" href="./"><b class="mark">N</b><span>Naru</span></a><label class="search"><span>⌕</span><input id="search" placeholder="Search anime..." autocomplete="off"></label><button class="btn install" id="install">Install</button><button class="btn primary" id="random">Surprise me</button></header><main class="wrap"><section class="hero"><div id="hero"><div class="eyebrow">Naru · Anime</div><h1>Loading...</h1><p>Discover anime and jump straight into episodes.</p></div></section><div id="sections"><section class="section"><div class="head"><div><h2>Trending now</h2><span class="muted">What people are watching</span></div></div><div class="grid" id="trending"></div></section><section class="section"><div class="head"><div><h2>Popular</h2><span class="muted">Big titles worth your time</span></div></div><div class="grid" id="popular"></div></section><section class="section"><div class="head"><div><h2>Latest releases</h2><span class="muted">Fresh anime</span></div></div><div class="grid" id="latest"></div></section><section class="section" id="results" hidden><div class="head"><h2>Search results</h2></div><div class="grid" id="resultGrid"></div></section></div></main><nav class="mobile"><a class="active" href="./">Home</a><a href="#trending">Browse</a><a href="#popular">Popular</a></nav><script>const API='https://graphql.anilist.co';const Q=`query($sort:[MediaSort],$page:Int,$perPage:Int){Page(page:$page,perPage:$perPage){media(type:ANIME,isAdult:false,sort:$sort){id title{english romaji userPreferred}coverImage{large extraLarge}bannerImage description(asHtml:false)averageScore seasonYear episodes format}}}`;const S=`query($q:String!){Page(page:1,perPage:18){media(type:ANIME,isAdult:false,search:$q,sort:[POPULARITY_DESC]){id title{english romaji userPreferred}coverImage{large}averageScore seasonYear episodes format}}}`;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function gql(q,v){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:v})});const j=await r.json();if(j.errors)throw Error(j.errors[0].message);return j.data}function card(a){let t=esc(a.title?.english||a.title?.romaji||a.title?.userPreferred);return `<a class="card" href="anime.html?id=${a.id}"><div class="poster"><img loading="lazy" src="${a.coverImage?.large||a.coverImage?.extraLarge||''}" alt="${t}"><span class="badge">${a.format||'ANIME'}</span>${a.averageScore?`<span class="score">${(a.averageScore/10).toFixed(1)}</span>`:''}</div><h3>${t}</h3><p>${a.seasonYear||'—'} · ${a.episodes||'?'} eps</p></a>`}function render(id,list){$(id).innerHTML=list.map(card).join('')}async function load(){try{let [a,b,c]=await Promise.all([gql(Q,{sort:['TRENDING_DESC'],page:1,perPage:6}),gql(Q,{sort:['POPULARITY_DESC'],page:1,perPage:6}),gql(Q,{sort:['START_DATE_DESC'],page:1,perPage:6})]);render('trending',a.Page.media);render('popular',b.Page.media);render('latest',c.Page.media);hero(a.Page.media[0])}catch(e){document.querySelectorAll('.grid').forEach(x=>x.innerHTML='<p>Could not load anime. Refresh and try again.</p>')}}function hero(a){if(!a)return;let t=a.title?.english||a.title?.romaji||a.title?.userPreferred;$('hero').innerHTML=`<div class="eyebrow">Naru · Anime</div><h1>${esc(t)}</h1><div class="meta">${[a.seasonYear,a.format,a.episodes?`${a.episodes} episodes`:null,a.averageScore?`${(a.averageScore/10).toFixed(1)} score`:null].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><p>${esc((a.description||'Discover this anime on Naru.').replace(/<[^>]*>/g,'').slice(0,320))}</p><div class="actions"><a class="btn primary" href="anime.html?id=${a.id}">View anime</a><a class="btn" href="watch.html?id=${a.id}&episode=1">Episode 1</a></div>`;let im=document.createElement('img');im.src=a.bannerImage||a.coverImage?.extraLarge||'';im.alt='';$('hero').parentElement.appendChild(im);$('hero').parentElement.querySelector('img').className='hero-art'}let timer;$('search').oninput=e=>{clearTimeout(timer);let q=e.target.value.trim();if(!q){$('results').hidden=true;return}timer=setTimeout(async()=>{try{let d=await gql(S,{q});$('results').hidden=false;render('resultGrid',d.Page.media);$('results').scrollIntoView({behavior:'smooth'})}catch{}},350)};$('random').onclick=async()=>{let d=await gql(Q,{sort:['POPULARITY_DESC'],page:Math.floor(Math.random()*8)+1,perPage:6});let a=d.Page.media[Math.floor(Math.random()*d.Page.media.length)];location.href=`anime.html?id=${a.id}`};let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='inline-flex'});$('install').onclick=()=>deferred?.prompt();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});load();</script></body></html>
