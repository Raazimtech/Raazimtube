<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6b00"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Watch · Naru</title>
<style>
:root{--o:#ff6b00}*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{height:66px;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 18px;gap:11px;background:#0b0b0b;position:sticky;top:0;z-index:5}.mark{width:38px;height:38px;background:var(--o);color:#111;border-radius:11px;display:grid;place-items:center;font-weight:900}.brand{font-weight:800}.back{margin-left:auto;background:#151515;border:1px solid #292929;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700}.wrap{width:min(1400px,100%);margin:auto;padding:20px 16px 100px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.playerbox{background:#0f0f0f;border:1px solid #252525;border-radius:17px;overflow:hidden}.video{width:100%;aspect-ratio:16/9;background:#000;display:block}.playerbar{padding:16px}.title{font-size:20px;margin:0 0 7px}.sub{font-size:12px;color:#888}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{background:#171717;border:1px solid #2b2b2b;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.side{background:#0f0f0f;border:1px solid #252525;border-radius:17px;padding:15px;max-height:680px;overflow:auto}.side h2{font-size:16px;margin:2px 0 13px}.ep{display:flex;align-items:center;gap:11px;padding:10px;border-radius:10px;color:#aaa}.ep:hover,.ep.active{background:#191919;color:#fff}.num{width:31px;height:31px;border-radius:8px;background:#181818;display:grid;place-items:center;font-size:11px;font-weight:800}.active .num{background:var(--o);color:#111}.panel{margin-top:18px;padding:15px;background:#101010;border:1px solid #252525;border-radius:15px}.panel h2{font-size:15px;margin:0 0 10px}.status{color:#aaa;font-size:12px;line-height:1.6}.status.ok{color:#8be28b}.status.bad{color:#ff8b8b}.source{display:flex;gap:8px;flex-wrap:wrap}.source button{border:1px solid #333;background:#171717;color:#ddd;border-radius:9px;padding:8px 10px;font-size:11px;cursor:pointer}.source button.active{background:var(--o);color:#111;border-color:var(--o)}.empty{padding:20px;color:#777}.footer{border-top:1px solid #242424;margin-top:30px;padding:24px 0 20px;color:#777;font-size:11px;text-align:center}.footer a{color:#ff8a33;font-weight:700}.mobile{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{max-height:none}.top{height:62px}}@media(max-width:650px){.mobile{position:fixed;display:flex;bottom:0;left:0;right:0;height:62px;background:#0c0c0c;border-top:1px solid #242424;z-index:30;justify-content:space-around}.mobile a{display:flex;align-items:center;justify-content:center;flex:1;color:#777;font-size:10px;font-weight:700}.mobile a.active{color:var(--o)}}
</style>
</head>
<body>
<header class="top"><a href="./" style="display:flex;align-items:center;gap:10px"><b class="mark">N</b><span class="brand">Naru</span></a><a class="back" id="back" href="./">← Back</a></header>
<main class="wrap"><div class="layout"><section><div class="playerbox"><video id="video" class="video" controls playsinline preload="metadata"></video><div class="playerbar"><h1 id="title" class="title">Loading episode...</h1><div id="sub" class="sub">Preparing episode</div><div class="actions"><button class="btn" id="prev">← Previous</button><a class="btn" id="details" href="#">Anime details</a><button class="btn" id="next">Next →</button></div></div></div><div class="panel"><h2>Playback</h2><div id="status" class="status">Preparing your episode...</div><div id="sources" class="source" style="margin-top:12px"></div></div></section><aside class="side"><h2>Episodes</h2><div id="episodes" class="empty">Loading...</div></aside></div><footer class="footer">Built by <a href="https://raazimtech.github.io/Raazim-tech/" target="_blank" rel="noopener">Raazim Tech</a> · Abdikariim Mohamoud Ibrahim</footer></main>
<nav class="mobile"><a href="./">Home</a><a href="./#trending">Browse</a><a href="./#popular">Popular</a><a class="active" href="#">Watch</a></nav>
<script>
const ANILIST='https://graphql.anilist.co';
const SOURCE_INDEX='./media/sources.json';
const qs=new URLSearchParams(location.search),id=Number(qs.get('id')),ep=Math.max(1,Number(qs.get('episode'))||1);
const $=x=>document.getElementById(x);let hls=null,currentSources=[];
function status(t,c=''){ $('status').textContent=t;$('status').className='status '+c }
function cleanup(){if(hls){hls.destroy();hls=null}$('video').pause();$('video').removeAttribute('src');$('video').load()}
async function play(url){if(!url)return false;cleanup();const v=$('video'),isHls=/\.m3u8(?:$|\?)/i.test(url);status('Starting episode...');v.onerror=()=>status('This episode could not be played right now.','bad');v.onloadedmetadata=()=>status('Episode ready.','ok');v.onplaying=()=>status('Playing.','ok');
try{if(isHls&&window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:false});hls.on(Hls.Events.MANIFEST_PARSED,()=>{status('Episode ready.','ok');attemptAutoplay(v)});hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)status('Playback is temporarily unavailable.','bad')});hls.loadSource(url);hls.attachMedia(v);return true}v.src=url;v.load();if(isHls&&v.canPlayType('application/vnd.apple.mpegurl')){status('Episode ready.','ok');attemptAutoplay(v)}else{v.addEventListener('loadedmetadata',()=>attemptAutoplay(v),{once:true});}return true}catch(e){status('This episode could not be played right now.','bad');return false}}
function attemptAutoplay(v){v.play().catch(()=>{status('Episode ready. Press play.','ok')})}
function renderSources(){const box=$('sources');box.innerHTML='';if(!currentSources.length)return;currentSources.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.label||`Source ${i+1}`;b.className=i===0?'active':'';b.onclick=async()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');await play(s.url)};box.appendChild(b)})}
async function loadAuthorizedSources(animeId,episode){try{const r=await fetch(SOURCE_INDEX,{cache:'no-store'});if(!r.ok)return [];const data=await r.json();const key=`${animeId}:${episode}`;const value=data[key]||data[String(animeId)]?.[String(episode)]||[];return Array.isArray(value)?value.filter(x=>x&&x.url):value&&value.url?[value]:[]}catch(e){return []}}
async function run(){if(!id){status('No episode selected.','bad');return}try{const r=await fetch(ANILIST,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:`query($id:Int!){Media(id:$id,type:ANIME){id title{english romaji userPreferred}episodes duration}}`,variables:{id}})});const j=await r.json();if(j.errors)throw Error(j.errors[0].message);const m=j.data.Media;if(!m)throw Error('Not found');const name=m.title.english||m.title.romaji||m.title.userPreferred;$('title').textContent=`${name} · Episode ${ep}`;document.title=`${name} E${ep} · Naru`;$('sub').textContent=`Episode ${ep}${m.duration?' · '+m.duration+' min':''}`;$('details').href=`anime.html?id=${id}`;$('back').href=`anime.html?id=${id}`;const total=m.episodes||0;$('prev').disabled=ep<=1;$('next').disabled=total?ep>=total:false;$('prev').onclick=()=>{if(ep>1)location.href=`watch.html?id=${id}&episode=${ep-1}`};$('next').onclick=()=>{if(!total||ep<total)location.href=`watch.html?id=${id}&episode=${ep+1}`};let list=$('episodes');list.innerHTML='';if(total){for(let i=1;i<=total;i++){const a=document.createElement('a');a.className=`ep ${i===ep?'active':''}`;a.href=`watch.html?id=${id}&episode=${i}`;a.innerHTML=`<span class="num">${i}</span><span>Episode ${i}</span>`;list.appendChild(a)}}else list.innerHTML='<div class="empty">Episode count unavailable.</div>';
currentSources=await loadAuthorizedSources(id,ep);renderSources();if(currentSources.length){await play(currentSources[0].url)}else status('This episode is not available from a configured playback source.','bad');
}catch(e){status('Could not load this episode. Please try again.','bad')}}
run();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
